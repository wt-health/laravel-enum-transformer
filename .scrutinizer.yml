checks:
  php: true

build:
  environment:
    php:
      version: 8.4
  nodes:
    analysis:
      cache:
        directories:
          - ~/.composer
      tests:
        override:
          - php-scrutinizer-run

build_failure_conditions:
  - 'elements.rating(<= B).new.exists'

filter:
  excluded_paths:
    - tests/
